<!DOCTYPE html>
<html>
  <head>
    <style>
      body, #main {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;

        background: black;
      }

      #main {
        gap: 75px;
      }

      #mainText, button {
        color: white;
        font-family: "Comic Sans MS", cursive;
        font-weight: bold;
        font-style: italic;
        font-size: xx-large;
      }
      #mainText:hover {
        box-shadow: 0 0 20px 50px white;
        transition: box-shadow 1s ease;
      }

      button {
        color: black;
      }
      button:hover {
        transform: translateY(-15px);
      }
    </style>
  </head>

  <body>
    <div id="main">
    <p id="mainText">[Placeholder Text]</p>
    <button type="button" onclick="start()">Click here to start!</button>
    </div>

    <script>
      let i = 5;
      let i2 = 0;
      let i3 = 0;

      const pr = document.querySelector("p");

      function start() {

        console.log("starting");
        document.querySelector("button").remove();
        scroll();

        const countdown = setInterval(() => {
          pr.textContent = i--;
          if (i <= 0) { clearInterval(countdown); loadText();};
        }, 1000);
      };

      function loadText() {
        const texts = [
          "Hello everyone!",
          "Let's get straight into the point since I don't wanna waste anyone's time here",
          "So, it's been almost 4 months since I've started leaning JavaScript, HTML and CSS seriously. (since March of 2026)",
          "Thank you for the tips and helps that y'all gave me along the way, I may or may not remember them but I really appreciate it.",
          "My largest project yet - Life Simulator wouldn't be completed or even created without you all's help.",
          "And I probably wouldn't be the person I am right now.",
          "No jokes in this file, because y'all helps weren't either.",
          "Once again, thank you for everything. I hope that you're always happy alongside with your family members or someone that you love. cya",
          "I will be continuing to make codes, and this might looks like larp but whatever, I don't care.",
          "- watermelob (intentional typo oat)"
        ]
        const changeTexts = setInterval(() => {
          pr.textContent = texts[i++];
          if (i >= texts.length) { clearInterval(changeTexts); }
        }, 3000);
      };

      function scroll() {
        const titles = [
          "t",
          "th",
          "tha",
          "than",
          "thank",
          "thank y",
          "thank yo",
          "thank you",
          "thank you!",
          "thank you! :",
          "thank you! :)"
        ];

        const scrollTitle = setInterval(() => {
          document.title = titles[i3++];
          if (i3 >= titles.length) i3 = 0;
        }, 500);
      }
    </script>
  </body>
</html>
